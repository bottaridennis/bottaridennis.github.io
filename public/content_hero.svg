<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Radial Glow Behind Icon -->
  <circle cx="400" cy="225" r="200" fill="url(#glow)"/>

  <!-- Top Glass Bar -->
  <rect x="40" y="35" width="720" height="50" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="68" cy="60" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="86" cy="60" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="104" cy="60" r="5" fill="#10b981" opacity="0.8"/>
  <text x="730" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="1.5">DENNISBOTTARI.IT</text>

  <!-- Central Graphic / Icon Motif -->
  <g id="motif">
    <rect x="330" y="170" width="140" height="110" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
               <line x1="360" y1="205" x2="440" y2="205" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
               <line x1="360" y1="225" x2="420" y2="225" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
               <line x1="360" y1="245" x2="395" y2="245" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
               <circle cx="445" cy="245" r="12" fill="#2563eb"/>
  </g>

  <!-- Badge Pill -->
  <rect x="230" y="340" width="340" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="400" y="358" font-family="monospace" font-size="10.5" font-weight="700" fill="#e4e4e7" text-anchor="middle" letter-spacing="1.5">CREATOR STUDIO & SOCIAL PLANNER</text>

  <!-- Title Text -->
  <text x="400" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Content Hero</text>

  <!-- Subtitle Text -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">Drafts · Calendar · Media Asset Organizer · Previews</text>
</svg>